[project]
name = "generative-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jatin Kumar", email = "jatinkumar4148@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "transformers>=5.19.0",
]

[project.scripts]
generative-ai = "generative_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
